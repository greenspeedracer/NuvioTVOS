name: Sync Upstream Release and Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Specific upstream tag to build (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Determine Upstream Release Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ -n "${{ github.event.inputs.force_tag }}" ]; then
            TAG="${{ github.event.inputs.force_tag }}"
          else
            TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/bobsupra/NuvioTVOS/releases/latest | jq -r '.tag_name // empty')

            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              TAG=$(git ls-remote --tags --sort='v:refname' https://github.com/bobsupra/NuvioTVOS.git | tail -n1 | sed 's/.*\///')
            fi
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not determine a valid upstream tag or release."
            exit 1
          fi

          echo "Target tag resolved: $TAG"
          echo "target_tag=$TAG" >> "$GITHUB_OUTPUT"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          if [ "$HTTP_STATUS" = "200" ] && [ -z "${{ github.event.inputs.force_tag }}" ]; then
            echo "Release $TAG already exists in this repository. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG needs to be built."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Upstream Tag
        if: steps.get_tag.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'bobsupra/NuvioTVOS'
          ref: ${{ steps.get_tag.outputs.target_tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Patch Bundle IDs and App Group
        if: steps.get_tag.outputs.should_build == 'true'
        run: |
          OLD_BUNDLE="com.pyksel.nuviotvos"
          NEW_BUNDLE="com.ronkozel.nuviotvos"

          OLD_GROUP="group.com.pyksel.nuviotvos"
          NEW_GROUP="group.M3HWHXLPC7.com.pyksel.nuviotvos"

          echo "Replacing $OLD_GROUP with $NEW_GROUP..."
          find . -type f \( -name "*.swift" -o -name "*.plist" -o -name "*.entitlements" -o -name "*.Project.swift" -o -name "Project.swift" \) \
            -not -path "*/.*" \
            -exec sed -i '' "s/${OLD_GROUP}/${NEW_GROUP}/g" {} +

          echo "Replacing $OLD_BUNDLE with $NEW_BUNDLE..."
          find . -type f \( -name "*.swift" -o -name "*.plist" -o -name "*.entitlements" -o -name "*.Project.swift" -o -name "Project.swift" \) \
            -not -path "*/.*" \
            -exec sed -i '' "s/${OLD_BUNDLE}/${NEW_BUNDLE}/g" {} +

          echo "Verification:"
          grep -rn "$NEW_BUNDLE" . || { echo "Failed to patch bundle ID"; exit 1; }
          grep -rn "$NEW_GROUP" . || { echo "Failed to patch app group"; exit 1; }

      - name: Show Xcode version
        if: steps.get_tag.outputs.should_build == 'true'
        run: xcodebuild -version

      - name: Install mise
        if: steps.get_tag.outputs.should_build == 'true'
        run: curl https://mise.run | sh

      - name: Install pinned tool versions (Tuist)
        if: steps.get_tag.outputs.should_build == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install

      - name: Build IPA
        if: steps.get_tag.outputs.should_build == 'true'
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        if: steps.get_tag.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-${{ steps.get_tag.outputs.target_tag }}-unsigned-ipa
          path: build-ipa/*.ipa
          if-no-files-found: error

      - name: Publish Fork Release
        if: steps.get_tag.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.target_tag }}
          name: Nuvio tvOS ${{ steps.get_tag.outputs.target_tag }} (Patched Group)
          body: |
            Automated build for upstream release [${{ steps.get_tag.outputs.target_tag }}](https://github.com/bobsupra/NuvioTVOS/releases/tag/${{ steps.get_tag.outputs.target_tag }}).
            Patched App Group: `group.M3HWHXLPC7.com.pyksel.nuviotvos`.
          files: build-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

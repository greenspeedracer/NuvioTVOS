name: Sync Upstream Release and Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Specific upstream tag to build (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Determine Upstream Release Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ -n "${{ github.event.inputs.force_tag }}" ]; then
            TAG="${{ github.event.inputs.force_tag }}"
          else
            TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/bobsupra/NuvioTVOS/releases/latest | jq -r '.tag_name // empty')

            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              TAG=$(git ls-remote --tags --sort='v:refname' https://github.com/bobsupra/NuvioTVOS.git | tail -n1 | sed 's/.*\///')
            fi
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not determine a valid upstream tag or release."
            exit 1
          fi

          echo "Target tag resolved: $TAG"
          echo "target_tag=$TAG" >> "$GITHUB_OUTPUT"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          if [ "$HTTP_STATUS" = "200" ] && [ -z "${{ github.event.inputs.force_tag }}" ]; then
            echo "Release $TAG already exists in this repository. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG needs to be built."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Upstream Tag
        if: steps.get_tag.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'bobsupra/NuvioTVOS'
          ref: ${{ steps.get_tag.outputs.target_tag }}
          submodules: recursive

      - name: Patch Bundle IDs and App Group
        if: steps.get_tag.outputs.should_build == 'true'
        run: |
          OLD_BUNDLE="com.pyksel.nuviotvos"
          NEW_BUNDLE="com.ronkozel.nuviotvos"

          TARGET_GROUP="group.M3HWHXLPC7.com.pyksel.nuviotvos"

          echo "1. Replacing bundle IDs..."
          find . -type f \( -name "*.swift" -o -name "*.plist" -o -name "*.entitlements" -o -name "*.Project.swift" -o -name "Project.swift" \) \
            -not -path "*/.*" \
            -exec sed -i '' "s/${OLD_BUNDLE}/${NEW_BUNDLE}/g" {} +

          echo "2. Enforcing App Group across codebase..."
          # Replace both the original upstream group and any mutated bundle variations
          find . -type f \( -name "*.swift" -o -name "*.plist" -o -name "*.entitlements" -o -name "*.Project.swift" -o -name "Project.swift" \) \
            -not -path "*/.*" \
            -exec sed -i '' "s/group\.[A-Z0-9]*\.com\.ronkozel\.nuviotvos/${TARGET_GROUP}/g" {} + \
            -exec sed -i '' "s/group\.com\.ronkozel\.nuviotvos/${TARGET_GROUP}/g" {} + \
            -exec sed -i '' "s/group\.com\.pyksel\.nuviotvos/${TARGET_GROUP}/g" {} +

          echo "Verification:"
          echo "--- Bundle ID matches ---"
          grep -rn "$NEW_BUNDLE" . || { echo "Failed to patch bundle ID"; exit 1; }

          echo "--- App Group matches ---"
          grep -rn "$TARGET_GROUP" . || { echo "Failed to patch app group"; exit 1; }

      - name: Pin Top Shelf App Group
        if: steps.get_tag.outputs.should_build == 'true'
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("tvosApp/NuvioTV/Sources/Core/TopShelf/TopShelfFeed.swift")
          s = p.read_text()
          old = 'return "group.\\(mainAppBundleID)"'
          new = 'return "group.M3HWHXLPC7.com.pyksel.nuviotvos"'
          assert s.count(old) == 1, f"expected 1 match, found {s.count(old)}"
          p.write_text(s.replace(old, new))
          PY

